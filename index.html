<!DOCTYPE html>
<html lang="en">
<head>

<meta property="og:description" content="Essential products for mothers, children and elders. Cash on delivery across Bangladesh.">

<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#2265ab;--orange:#ca5529;--bg:#f4f6fa;--surface:#fff;--ink:#1c2430;--mute:#5d6877;--line:#dfe4ec;--chip:#eaf1fa;--head:#f8f8f8;--on-blue:#fff;--ot:#b24a24;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151d;--surface:#19212c;--ink:#e9edf3;--mute:#a1acbb;--line:#2b3644;--chip:#1f2c3f;--blue:#6aa6e8;--on-blue:#0b1b2e;--ot:#ff9a6b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10151d;--surface:#19212c;--ink:#e9edf3;--mute:#a1acbb;--line:#2b3644;--chip:#1f2c3f;--blue:#6aa6e8;--on-blue:#0b1b2e;--ot:#ff9a6b;color-scheme:dark}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 84px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 "Hind Siliguri",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--head);z-index:30}
a{color:inherit;text-decoration:none}button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:1100px;margin:0 auto;padding:0 12px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head);border-bottom:1px solid var(--line);color:#1c2430}
.top{display:flex;align-items:center;gap:8px;padding:4px 0}
.logo{width:28px;flex:none;display:block}
.logo img{display:block;width:100%;height:auto}
.search{flex:1;display:flex;align-items:center;border:2px solid var(--orange);border-radius:999px;background:#fff;overflow:hidden;min-width:0;height:42px}
.search .si{width:18px;height:18px;margin-left:12px;color:#8a95a5}
.search input{flex:1;min-width:0;height:100%;border:0;background:transparent;padding:0 8px;font-size:16px;color:#1c2430;outline:none}
.search input::-webkit-search-cancel-button{display:none}
.search .clr{border:0;background:none;padding:0 10px;height:100%;color:#5d6877;cursor:pointer;font-size:22px}
.search .go{border:0;background:var(--orange);color:#fff;padding:0 16px;height:100%;font-size:14px;font-weight:700;cursor:pointer}
.search:focus-within{box-shadow:0 0 0 3px rgba(201,85,43,.3)}
.desknav{display:none;gap:4px}
.desknav a{display:flex;gap:6px;align-items:center;padding:6px 10px;border-radius:8px;font-weight:500}
.desknav a[aria-current=page]{color:var(--blue);background:var(--chip)}
.tabs{display:flex;gap:16px;overflow-x:auto;padding:0 0 1px;font-size:14px;scrollbar-width:none}
.tabs button{border:0;background:none;padding:1px 2px;font-size:14px;font-weight:600;color:#5d6877;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
.tabs button[aria-selected=true]{color:var(--blue);border-color:var(--orange)}
main{padding:12px 0 8px;min-height:70vh}
/* Cover */
.cover{position:relative;overflow:hidden;border-radius:20px;background:linear-gradient(135deg,#174c86 0%,#2265ab 55%,#2f7cc4 100%);color:#fff;padding:22px 18px 18px;display:grid;gap:18px}
.cover::before{content:"";position:absolute;width:340px;height:340px;border-radius:50%;background:rgba(255,255,255,.07);top:-150px;right:-110px}
.cover::after{content:"";position:absolute;width:240px;height:240px;border-radius:50%;background:rgba(202,85,41,.38);bottom:-140px;left:-70px}
.cover>*{position:relative;z-index:1}
.cv-kicker{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:3px 12px 3px 8px;font-size:13px;font-weight:600}
.cv-kicker svg{width:16px;height:16px}
.cover h1{margin:12px 0 8px;font-size:clamp(30px,8vw,50px);line-height:1.15;font-weight:700}
.cover h1 span{color:#ffcfb3}
.cover p{margin:0;font-size:16px;line-height:1.5;opacity:.93;max-width:32em}
.cv-cta{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.cv-cta .btn{padding:12px 22px;font-size:16px}
.btn.light{background:#fff;color:#174c86}
.btn.ghost{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.65)}
.cv-art{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cv-art a{display:block;border-radius:14px;overflow:hidden;background:#fff;aspect-ratio:1;box-shadow:0 8px 22px rgba(0,0,0,.2)}
.cv-art img{width:100%;height:100%;object-fit:cover;display:block}
.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.trust div{background:rgba(255,255,255,.12);border-radius:12px;padding:8px 6px;text-align:center;font-size:12px;line-height:1.3;color:#dce8f6}
.trust b{display:block;font-size:13.5px;color:#fff}
/* Filters */
.filt{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 12px 12px}
.fhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0 2px}
.fhead h2{margin:0;font-size:20px}.fcount{font-size:13.5px;color:var(--mute);white-space:nowrap}
.filt .chips{margin-top:10px}
.chip .n{display:inline-grid;place-items:center;min-width:22px;height:20px;padding:0 6px;margin-left:4px;border-radius:999px;background:var(--chip);color:var(--blue);font-size:12px}
.chip[aria-selected=true] .n{background:rgba(255,255,255,.25);color:inherit}
.frow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;flex:1 1 280px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 6px;font-weight:600;font-size:14px;color:var(--mute);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--blue);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.sort{display:flex;align-items:center;gap:8px;flex:1 1 220px;font-size:14px;color:var(--mute);font-weight:600}
.sort select{margin:0;flex:1;padding:9px 10px;border-radius:12px;background:var(--surface);font-weight:600;font-size:15px}
.active{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.active:empty{display:none}
.fx{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--blue);color:var(--blue);background:var(--chip);border-radius:999px;padding:4px 12px;font-size:13.5px;font-weight:600;cursor:pointer}
.fx.reset{border-color:transparent;background:none;color:var(--ot);text-decoration:underline}
#grid{margin-top:12px}
/* Footer */
footer.site{background:#0f2f52;color:#dbe6f3;margin-top:28px;padding:28px 0 calc(88px + env(safe-area-inset-bottom,0px))}
body.pdp footer.site,body.flow footer.site{padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
footer.site h2{margin:0;font-size:22px;color:#fff}
.fsub{margin:4px 0 14px;color:#a9bdd4;font-size:14.5px}
.cgrid{display:grid;grid-template-columns:1fr;gap:10px}
.ccard{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);border-radius:14px;padding:12px 14px;color:#fff;min-width:0}
a.ccard:hover{background:rgba(255,255,255,.14)}
.ccard small{display:block;color:#a9bdd4;font-size:12.5px;line-height:1.2}.ccard b{display:block;font-weight:600;overflow-wrap:anywhere;line-height:1.35}
.cic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:#ca5529;color:#fff;flex:none}
.fbrand{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;margin-top:26px;padding-top:26px;border-top:1px solid rgba(255,255,255,.13)}
.fbrand p{margin:0;max-width:34em;color:#c4d3e4;font-size:14.5px}
.fcols{display:grid;gap:20px;margin-top:22px;padding-top:22px;border-top:1px solid rgba(255,255,255,.13)}
.fcols h3{margin:0 0 8px;font-size:15.5px;color:#fff}
.frow2{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:14.5px}
.fcols ol{margin:0;padding-left:18px;font-size:14.5px}
.flinks{display:flex;flex-wrap:wrap;gap:2px 16px}.flinks a{color:#dbe6f3;padding:5px 0;text-decoration:underline;text-underline-offset:3px}
.fnote{font-size:13px;color:#a9bdd4;margin:6px 0 0}
.fbase{margin-top:22px;padding-top:14px;border-top:1px solid rgba(255,255,255,.13);text-align:center;font-size:13px;color:#a9bdd4}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:var(--surface);border-radius:12px;padding:7px 2px;border:1px solid var(--line)}
.quick button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:500;cursor:pointer;padding:1px;line-height:1.15}
.quick .ic svg{width:18px;height:18px}.quick .ic{width:32px;height:32px;border-radius:10px;background:var(--chip);color:var(--blue);display:grid;place-items:center}
.quick button:nth-child(even) .ic{color:var(--orange)}
.promos{display:grid;gap:10px;margin-top:12px}
.promo{border-radius:14px;padding:18px;position:relative;overflow:hidden}
.promo.a{background:var(--blue);color:#fff}
.promo.a h2{margin:0;font-size:26px;line-height:1.25}
.promo.a p{margin:6px 0 0;opacity:.92}
.promo.b{background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;gap:12px}
.promo.b .ic{width:46px;height:46px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;flex:none}
.promo h3{margin:0;font-size:16px}.promo.b p{margin:2px 0 0;color:var(--mute);font-size:14px}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.panel{background:linear-gradient(var(--chip),var(--surface) 60%);border:1px solid var(--line);border-radius:12px;padding:7px 8px 8px}
.panel h2{margin:0 0 5px;font-size:14.5px;line-height:1.2}
.two{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.mini{display:block;text-align:center;min-width:0}
.mi{aspect-ratio:5/4;border-radius:8px;overflow:hidden;background:var(--chip)}.mi img{width:100%;height:100%;object-fit:cover;display:block}
.mp{font-weight:700;color:var(--ot);font-size:13.5px;margin-top:2px;line-height:1.2}.mp s{color:var(--mute);font-weight:400;font-size:12px}
.mn{font-size:11.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pn{margin:4px 0 0;font-size:11px;color:var(--mute);text-align:center}
.up{margin-top:12px;border-radius:14px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.uph{padding:10px 14px;background:linear-gradient(90deg,var(--chip),var(--surface))}.uph h2{margin:0;font-size:17px}
.row{display:flex;gap:10px;overflow-x:auto;padding:10px 12px 12px}
.chips{display:flex;gap:8px;overflow-x:auto;margin-top:14px;scrollbar-width:none;padding-bottom:2px}
.achip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-weight:600;cursor:pointer;color:var(--ink);font-size:14px}
.achip[aria-selected=true]{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);margin-top:4px}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;font-weight:600;cursor:pointer;color:var(--ink)}
.chip[aria-selected=true]{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.ui{display:block;width:96px;flex:none;text-align:center}.ui img{width:96px;height:96px;border-radius:10px;display:block;object-fit:cover}
.un{font-size:13px;font-weight:600;margin-top:4px}.us{font-size:12px;color:var(--mute)}
.sh{display:flex;justify-content:space-between;align-items:baseline;margin:18px 2px 8px;gap:8px;flex-wrap:wrap}
.sh h2{margin:0;font-size:20px}.demo-note{font-size:12.5px;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.card{background:var(--surface);border-radius:12px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column}
.card:hover{border-color:var(--blue)}
.card .ph{aspect-ratio:1/1;background:var(--chip);overflow:hidden}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .b{padding:8px 10px 10px;display:flex;flex-direction:column;gap:2px}
.tag{align-self:flex-start;font-size:11.5px;background:var(--chip);color:var(--blue);border-radius:4px;padding:0 6px;font-weight:600}
.card h3{margin:2px 0 0;font-size:15px;line-height:1.3}
.price{font-weight:700;color:var(--ot);font-size:18px}.price small{font-weight:500;color:var(--mute);font-size:13px}
.meta{display:flex;justify-content:space-between;gap:6px;font-size:12.5px;color:var(--mute)}
.star{color:var(--orange);letter-spacing:1px}
.dm{font-size:10.5px;border:1px dashed var(--mute);border-radius:4px;padding:0 4px;margin-left:4px}
.empty,.soon{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:32px 16px;text-align:center}
.empty{grid-column:1/-1}.soon h2{margin:0 0 6px}
.btn{display:inline-block;text-align:center;text-decoration:none;border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;background:var(--blue);color:var(--on-blue)}
.btn.o{background:var(--orange);color:#fff;width:100%;font-size:18px}.btn.g{background:var(--chip);color:var(--blue)}
.back{display:inline-flex;gap:4px;align-items:center;border:0;background:none;color:var(--blue);font-weight:600;cursor:pointer;padding:6px 0}
.pd{display:grid;gap:12px;max-width:640px;margin:0 auto}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.vid{aspect-ratio:9/16;width:100%;width:min(100%,max(220px,calc((100vh - 150px)*9/16)));width:min(100%,max(220px,calc((100svh - 150px)*9/16)));margin:0 auto;background:#0e2744;border-radius:12px;overflow:hidden;display:grid;place-items:center;color:#fff;text-align:center}
.vid video{width:100%;height:100%;object-fit:contain;background:#000}
.vid span{padding:16px;font-weight:600}
.gal .main{aspect-ratio:1/1;background:var(--chip);border-radius:12px;overflow:hidden;display:grid;place-items:center}
.gal .main img{max-width:100%;max-height:100%;object-fit:contain}
.thumbs{display:flex;gap:8px;margin-top:8px;overflow-x:auto}
.thumbs button{width:60px;height:60px;border:2px solid var(--line);border-radius:8px;padding:0;background:var(--chip);cursor:pointer;overflow:hidden;flex:none}
.thumbs button[aria-pressed=true]{border-color:var(--orange)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.cap{font-size:12.5px;color:var(--mute);margin:6px 0 0}
.pd h1{margin:0;font-size:24px;line-height:1.25}
.pd .price{font-size:28px}
.pd dl{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}.pd dt{color:var(--mute)}.pd dd{margin:0}
.pending{color:var(--mute);font-style:italic}
form label{display:block;font-weight:600;margin-top:10px}
form input,form textarea{width:100%;margin-top:4px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.err{color:#c0262d;font-size:13.5px;min-height:1.2em}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .err{color:#ff8c8c}}
.qty{display:flex;gap:6px;align-items:center;margin-top:4px}.qty input{text-align:center;width:80px;margin:0}.qty button{width:42px;height:42px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:20px;cursor:pointer}
.cdot{display:inline-flex;align-items:center;gap:5px;margin-right:10px}.cdot i{width:14px;height:14px;border-radius:50%;border:1px solid var(--line);display:inline-block}
.colors{border:1px solid var(--line);border-radius:10px;margin:10px 0 0;padding:2px 12px 12px}.colors legend{font-weight:600;padding:0 6px}
.crow{display:flex;align-items:center;gap:10px;margin-top:8px}.crow .sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none}.crow .cn{flex:1;font-weight:600}.crow .qty{margin:0}.crow .qty input{width:56px}
.sum{background:var(--chip);border-radius:10px;padding:12px;margin-top:14px}.sum div{display:flex;justify-content:space-between;gap:8px}.sum .t{font-weight:700;font-size:18px;border-top:1px solid var(--line);margin-top:6px;padding-top:6px}
.notice{background:#fff4e5;color:#6b3b00;border:1px solid #f1c27d;border-radius:10px;padding:10px 12px;font-size:14px;margin-top:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.car{position:relative;border-radius:12px;overflow:hidden;background:var(--chip);width:100%;width:min(100%,max(220px,calc((100vh - 150px)*9/16)));width:min(100%,max(220px,calc((100svh - 150px)*9/16)));margin:0 auto}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;aspect-ratio:9/16;width:100%}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:start;display:grid;place-items:center;min-width:0}
.slide img{width:100%;height:100%;object-fit:contain;display:block}
.car .nv{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.5);color:#fff;font-size:24px;line-height:1;cursor:pointer}
.car .prev{left:8px}.car .next{right:8px}
.car .pp,.car .cnt{position:absolute;top:8px;border-radius:999px;background:rgba(0,0,0,.5);color:#fff;padding:3px 10px;font-size:12.5px;border:0}
.car .pp{right:8px;cursor:pointer}.car .cnt{left:8px}
.dots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:8px}
.dots button{position:relative;width:9px;height:9px;border-radius:5px;border:0;padding:0;background:rgba(255,255,255,.8);box-shadow:0 0 0 1px rgba(0,0,0,.3);cursor:pointer;transition:width .2s}
.dots button::after{content:"";position:absolute;inset:-9px -4px}
.dots button[aria-current=true]{background:var(--orange);width:22px}
.sub{font-size:12px;color:var(--mute);line-height:1.2}.up2{font-weight:700;color:var(--ot);font-size:13.5px}
.bdg{position:absolute;top:-5px;right:-8px;background:var(--orange);color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px;font-style:normal;font-weight:700}
nav.bottom a svg{position:relative}.nb{position:relative;display:inline-block}
.btn.wa{background:#1d9a50;color:#fff;display:block;width:100%}
.btn.ms{background:#0866ff;color:#fff;display:block;width:100%}
.sendbox{display:grid;gap:8px;margin-top:12px;text-align:left}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-size:24px;line-height:1.2;color:var(--blue)}.stat span{font-size:13px;color:var(--mute)}
.stat.hl{background:var(--blue);border-color:var(--blue)}.stat.hl b,.stat.hl span{color:var(--on-blue)}

/* Gallery: moves to the next image every 3 seconds. Visitors can swipe, use arrows or dots, or pause it. */
let galTimer = null;
function stopGallery(){ clearInterval(galTimer); galTimer = null; }
function initGallery(n){
 const sc = $("#gal"); if(!sc || n < 2) return;
 const dots = [...document.querySelectorAll("#gd button")], cnt = $("#gc"), pp = $("#gpp");
 let idx = 0, busyUntil = 0, paused = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
 const mark = () => { dots.forEach((d,j) => d.setAttribute("aria-current", String(j === idx))); cnt.textContent = (idx+1) + " / " + n; };
 const go = i => { idx = (i + n) % n; busyUntil = Date.now() + 700; sc.scrollTo({left: idx * sc.clientWidth, behavior: "smooth"}); mark(); };
 const start = () => { stopGallery(); if(!paused) galTimer = setInterval(() => go(idx + 1), 3000); };
 const setPaused = v => { paused = v; pp.textContent = v ? "▶ Play" : "❚❚ Pause"; pp.setAttribute("aria-label", v ? "Play slideshow" : "Pause slideshow"); start(); };
 $("#gp").onclick = () => { go(idx - 1); start(); };
 $("#gn").onclick = () => { go(idx + 1); start(); };
 dots.forEach(d => d.onclick = () => { go(+d.dataset.i); start(); });
 pp.onclick = () => setPaused(!paused);
 sc.addEventListener("scroll", () => { if(Date.now() < busyUntil) return; const i = Math.round(sc.scrollLeft / sc.clientWidth); if(i !== idx){ idx = i; mark(); } });
 sc.addEventListener("pointerdown", stopGallery);
 sc.addEventListener("pointerup", start); sc.addEventListener("pointercancel", start);
 setPaused(paused); mark();
}

   ${ex ? `<button class="btn g" type="button" id="del" style="margin-top:8px;width:100%">Delete product</button>` : ""}</form></div>`;
 const drawCols = () => { $("#cols").innerHTML = cols.map((c,i) => `<div class="crow"><input type="color" class="cc" data-i="${i}" value="${c.hex}" aria-label="Color" style="width:46px;height:40px;padding:2px;margin:0"><input class="cn2" data-i="${i}" placeholder="Color name" value="${esc(c.name)}" aria-label="Color name" style="margin:0"><button type="button" class="rm" data-i="${i}" aria-label="Remove color">✕</button></div>`).join("");
  document.querySelectorAll(".cc").forEach(x => x.oninput = () => { cols[+x.dataset.i].hex = x.value; });
  document.querySelectorAll(".cn2").forEach(x => x.oninput = () => { cols[+x.dataset.i].name = x.value; });
  document.querySelectorAll("#cols .rm").forEach(x => x.onclick = () => { cols.splice(+x.dataset.i, 1); drawCols(); }); };
 const drawPrev = () => { $("#prev").innerHTML = imgs.map((s,i) => `<button type="button" data-i="${i}" aria-label="Remove photo ${i+1}"><img src="${s}" alt=""></button>`).join("");
  document.querySelectorAll("#prev button").forEach(b => b.onclick = () => { imgs.splice(+b.dataset.i, 1); ths.splice(+b.dataset.i, 1); drawPrev(); }); };
 $("#addcol").onclick = () => { cols.push({name:"", hex:"#2265ab"}); drawCols(); };
 $("#pi").onchange = async e => { $("#e-pi").textContent = "";
  for(const file of [...e.target.files]){ if(imgs.length >= 5){ $("#e-pi").textContent = "Maximum 5 photos."; break; }
   try{ const im = await loadImg(file), w = Math.min(800, im.width), h = Math.round(im.height * w / im.width), s = Math.min(im.width, im.height);
    imgs.push(cropData(im, w, h, 0, 0, im.width, im.height, 0.72)); ths.push(cropData(im, 480, 480, (im.width - s) / 2, (im.height - s) / 2, s, s, 0.72));
   }catch(err){ $("#e-pi").textContent = "Could not read one of the photos."; } }
  e.target.value = ""; drawPrev(); };
 drawCols(); drawPrev();
 $("#pf").onsubmit = e => { e.preventDefault();
  const name = $("#pn").value.trim(), price = parseInt($("#pp").value, 10);
  $("#e-pn").textContent = name.length < 2 ? "Enter a product name." : ""; $("#e-pp").textContent = price >= 1 ? "" : "Enter a price.";
  if(name.length < 2){ $("#pn").focus(); return; } if(!(price >= 1)){ $("#pp").focus(); return; }
  const cat = $("#pc").value, p = mk(ex ? ex.id : Date.now(), ex ? ex.slug : slugify(name) + "-" + Date.now().toString(36), name, price,
   {cat, category:CATEGORIES.find(c => c.id === cat).label, upcoming:$("#pu").checked, subtitle:$("#ps").value.trim() || null, description:$("#pd").value.trim() || null,
    features:$("#pf2").value.split("\n").map(s => s.trim()).filter(Boolean), colors:cols.filter(c => c.name.trim()).map(c => ({name:c.name.trim(), hex:c.hex})),
    images:imgs.map((s,i) => ({src:s, alt:name + " photo " + (i+1)})), thumb:ths[0] || imgs[0] || null, maxQty:parseInt($("#pm").value, 10) || null, demo:false});
  const prev = custom.slice(); if(ex) custom[custom.indexOf(ex)] = p; else custom.push(p);
  if(!store.set("ff_products", custom)){ custom = prev; $("#e-pi").textContent = "Not enough space on this device. Use fewer or smaller photos."; return; }
  location.hash = "#/admin/products"; };
 if(ex) $("#del").onclick = function(){ if(this.dataset.s !== "1"){ this.dataset.s = "1"; this.textContent = "Tap again to delete"; return; }
  custom = custom.filter(c => c.slug !== slug); store.set("ff_products", custom); cart = cart.filter(l => l.slug !== slug); saveCart(); location.hash = "#/admin/products"; };
}

 stopGallery(); renderNav(h);

 else if(parts[1]==="product") viewProduct(parts[2]);

 window.scrollTo(0,0);
}
